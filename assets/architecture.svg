<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-labelledby="title desc">
  <title id="title">chat-app architecture</title>
  <desc id="desc">The browser talks to the Next.js web app over HTTP and to the Socket.io gateway over a WebSocket. The web app calls the NestJS API with a short-lived service token. Both the API and the gateway call services/messaging directly, which writes to PostgreSQL through the Prisma adapter in packages/db. Redis carries the Socket.io pub/sub between the two gateway replicas, the presence roster and typing sets, and rate limiting.</desc>

  <style>
    /* Both schemes. The diagram is read on GitHub, which serves a dark page to
       half its readers and cannot be asked which one; a fixed dark ink on a
       transparent background disappears there. */
    .bg { fill: #f4f1e8; }
    .box { fill: #fffefa; stroke: #7d7a6e; stroke-width: 1.5; }
    .accent-box { fill: #dceef4; stroke: #0d6b85; stroke-width: 1.5; }
    .ink { fill: #1b1a15; font-family: Figtree, system-ui, sans-serif; font-size: 15px; }
    .sub { fill: #57544a; font-family: Figtree, system-ui, sans-serif; font-size: 12px; }
    .mono { fill: #57544a; font-family: "Azeret Mono", ui-monospace, monospace; font-size: 11px; }
    .flow { stroke: #57544a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .flow-accent { stroke: #0d6b85; stroke-width: 2; fill: none; marker-end: url(#arrow-accent); }
    .arrowhead { fill: #57544a; }
    .arrowhead-accent { fill: #0d6b85; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #15191c; }
      .box { fill: #1e2327; stroke: #6f767b; }
      .accent-box { fill: #12303a; stroke: #63c9e6; }
      .ink { fill: #e8eaec; }
      .sub, .mono { fill: #9ba3a9; }
      .flow { stroke: #9ba3a9; }
      .flow-accent { stroke: #63c9e6; }
      .arrowhead { fill: #9ba3a9; }
      .arrowhead-accent { fill: #63c9e6; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead-accent" />
    </marker>
  </defs>

  <rect class="bg" width="880" height="560" />

  <!-- browser -->
  <rect class="box" x="360" y="20" width="160" height="52" rx="10" />
  <text class="ink" x="440" y="44" text-anchor="middle">browser</text>
  <text class="mono" x="440" y="62" text-anchor="middle">one socket, one session</text>

  <!-- web -->
  <rect class="box" x="330" y="120" width="220" height="66" rx="10" />
  <text class="ink" x="440" y="145" text-anchor="middle">apps/web  :3000</text>
  <text class="sub" x="440" y="164" text-anchor="middle">Next.js 14, Auth.js session</text>
  <text class="mono" x="440" y="179" text-anchor="middle">mints a fresh HS256 token per call</text>

  <!-- gateway -->
  <rect class="accent-box" x="60" y="250" width="250" height="76" rx="10" />
  <text class="ink" x="185" y="275" text-anchor="middle">apps/realtime  :4100  :4101</text>
  <text class="sub" x="185" y="294" text-anchor="middle">Socket.io gateway, two replicas</text>
  <text class="mono" x="185" y="313" text-anchor="middle">the process that scales horizontally</text>

  <!-- api -->
  <rect class="box" x="570" y="250" width="250" height="76" rx="10" />
  <text class="ink" x="695" y="275" text-anchor="middle">apps/api  :4000</text>
  <text class="sub" x="695" y="294" text-anchor="middle">NestJS 10, owns no socket server</text>
  <text class="mono" x="695" y="313" text-anchor="middle">broadcasts through a Redis emitter</text>

  <!-- messaging -->
  <rect class="accent-box" x="300" y="386" width="280" height="60" rx="10" />
  <text class="ink" x="440" y="410" text-anchor="middle">services/messaging</text>
  <text class="sub" x="440" y="430" text-anchor="middle">the one write path. No Prisma, no HTTP</text>

  <!-- postgres -->
  <rect class="box" x="620" y="470" width="200" height="60" rx="10" />
  <text class="ink" x="720" y="494" text-anchor="middle">PostgreSQL 16</text>
  <text class="mono" x="720" y="513" text-anchor="middle">UPDATE ... RETURNING next_seq - 1</text>

  <!-- redis -->
  <rect class="box" x="60" y="470" width="250" height="60" rx="10" />
  <text class="ink" x="185" y="492" text-anchor="middle">Redis 7</text>
  <text class="mono" x="185" y="510" text-anchor="middle">pub/sub · roster · typing · limits</text>

  <!-- flows -->
  <path class="flow" d="M 430 72 L 430 118" />
  <text class="mono" x="404" y="100" text-anchor="end">HTTP</text>

  <path class="flow-accent" d="M 370 60 C 180 70 130 150 178 246" />
  <text class="mono" x="150" y="140">WebSocket</text>

  <path class="flow" d="M 500 186 L 660 246" />
  <text class="mono" x="600" y="212">Bearer</text>

  <path class="flow-accent" d="M 250 328 C 300 360 320 372 356 384" />
  <path class="flow-accent" d="M 640 328 C 590 360 570 372 528 384" />
  <text class="mono" x="440" y="368" text-anchor="middle">both call it directly, one hop each</text>

  <path class="flow" d="M 560 440 L 660 468" />
  <path class="flow" d="M 185 330 L 185 466" />
  <text class="mono" x="196" y="404">roster, typing</text>

  <!-- replica to replica -->
  <path class="flow-accent" d="M 90 330 C 40 380 40 420 74 468" />
  <text class="mono" x="18" y="404">replica ↔ replica</text>
</svg>
